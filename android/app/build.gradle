plugins {
    id "com.android.application"
}

android {
    namespace "io.github.gssdesign.stockpicks"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gssdesign.stockpicks"
        minSdk 26
        targetSdk 34
        // CI passes the run number so every build installs over the last one.
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName "1.0." + (project.findProperty("versionCode") ?: "1")
    }

    signingConfigs {
        // One fixed key so updates install over the previous version.
        release {
            storeFile file("stockpicks.keystore")
            storePassword "stockpicks"
            keyAlias "stockpicks"
            keyPassword "stockpicks"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
