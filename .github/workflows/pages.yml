name: Publish site

# Publishes the website (index.html + data/, minus the large market snapshot)
# to GitHub Pages. Runs when the page or picks change, and after every
# Market data run (its commits use GITHUB_TOKEN, which doesn't trigger push
# workflows, so workflow_run picks those up).
on:
  push:
    paths:
      - "index.html"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Market data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest data, also after workflow_run
      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          rm -f _site/data/market.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
