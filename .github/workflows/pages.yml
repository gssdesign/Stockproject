name: Publish site

# Publishes the website (index.html + data/, minus the large market snapshot)
# to GitHub Pages. Runs when the page or picks change, and after every
# Market data run (its commits use GITHUB_TOKEN, which doesn't trigger push
# workflows, so workflow_run picks those up).
on:
  push:
    paths:
      - "index.html"
      - "data/**"
      - "scripts/widget_data.py"
      - "scripts/live_index.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Market data"]
    types: [completed]
  schedule:
    # Every 10 min during NSE hours (03:45-10:00 UTC = 9:15 AM-3:30 PM IST)
    # to refresh the live Nifty 50 strip (data/live.json).
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest data, also after workflow_run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: pip install --quiet "yfinance>=0.2.54" || true
      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          rm -f _site/data/market.js
          python3 scripts/widget_data.py _site   # data/widget.json for the Android widget
          python3 scripts/live_index.py _site || true   # data/live.json: latest Nifty 50
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
