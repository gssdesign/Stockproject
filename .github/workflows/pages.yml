name: Publish site

# Publishes the website (index.html + data/, minus the large market snapshot)
# to GitHub Pages. Runs when the page or picks change, and after every
# Market data run (its commits use GITHUB_TOKEN, which doesn't trigger push
# workflows, so workflow_run picks those up).
on:
  push:
    branches: [claude/festive-cori-i6k9vq]   # only the live branch may deploy (Pages environment rule)
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icons/**"
      - "data/**"
      - "scripts/widget_data.py"
      - "scripts/live_index.py"
      - "scripts/form_config.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Market data", "Mutual funds"]
    types: [completed]
    branches: [claude/festive-cori-i6k9vq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended pattern): the uploaded
  # site is fully registered before the deploy job asks for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest data, also after workflow_run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: pip install --quiet "yfinance>=0.2.54" || true
      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          cp -r icons _site/
          cp -r data _site/
          rm -f _site/data/market.js
          python3 scripts/widget_data.py _site   # data/widget.json for the Android widget
          python3 scripts/live_index.py _site || true   # data/live.json: latest Nifty 50
          python3 scripts/form_config.py _site || true  # data/feedback.json: suggestion form fields
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub sometimes can't list a just-uploaded artifact yet ("No artifacts named
      # github-pages were found"). Retry twice, waiting a little longer each time.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
