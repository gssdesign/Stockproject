name: Android app

# Builds the Stock SI Android app (android/) and publishes the signed APK
# to the "android-latest" release, so the download link never changes:
# https://github.com/gssdesign/Stockproject/releases/download/android-latest/StockSI.apk
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk StockSI.apk && cp StockSI.apk StockPicks.apk  # old link keeps working
      - uses: actions/upload-artifact@v4
        with:
          name: StockSI-apk
          path: StockSI.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest StockSI.apk StockPicks.apk \
            --title "Stock SI Android app (build ${{ github.run_number }})" \
            --notes "Install: open this page on your Android phone, tap StockSI.apk, then allow 'Install unknown apps' for your browser when asked. Updates install over the previous version. Not financial advice." \
            --target "${{ github.sha }}"
